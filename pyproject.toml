[project]
name = "cinnamon-mosaic-icons"
version = "2.0.0"
description = "Freedesktop icon theme generator: Material file icons + Colloid system UI for Cinnamon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pillow>=10.2",
  "resvg-py>=0.3",
]

[project.urls]
Documentation = "https://github.com/<your-org>/cinnamon-mosaic-icons"

[tool.uv]
# The theme is generated by the scripts in scripts/, not imported as a package.
package = false
